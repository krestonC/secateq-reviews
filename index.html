<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex,nofollow" />
  <title>Leave a Google review</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      background: #f4f4f5;
      color: #18181b;
      line-height: 1.45;
    }
    main {
      width: 100%;
      max-width: 420px;
      background: #fff;
      border: 1px solid #e4e4e7;
      border-radius: 12px;
      padding: 28px 24px 32px;
    }
    h1 {
      margin: 0 0 12px;
      font-size: 1.35rem;
      font-weight: 650;
      letter-spacing: -0.02em;
    }
    p { margin: 0 0 14px; font-size: 1rem; color: #3f3f46; }
    .note { font-size: 0.9rem; color: #71717a; margin-bottom: 22px; }
    a.btn {
      display: block;
      text-align: center;
      text-decoration: none;
      background: #18181b;
      color: #fff;
      font-weight: 600;
      font-size: 1.05rem;
      padding: 14px 18px;
      border-radius: 8px;
    }
    a.btn:active { opacity: 0.9; }
    .alt {
      margin-top: 16px;
      text-align: center;
      font-size: 0.85rem;
    }
    .alt a { color: #52525b; }
  </style>
</head>
<body>
  <main>
    <h1>Got 30 seconds?</h1>
    <p>If you work with us, please leave an honest Google review. Stars plus one short sentence is enough.</p>
    <p class="note">Opens Google’s review form. Sign in with your own Google account. No script — just what you actually think.</p>
    <a class="btn" id="review" href="https://search.google.com/local/writereview?placeid=ChIJr9Q9-BhnzB0RrdTMNuRmDRg" rel="noopener">Write a Google review</a>
    <p class="alt"><a href="https://maps.app.goo.gl/gFVKAkYoEfGFFLf29" rel="noopener">Open the Google listing instead</a></p>
  </main>
</body>
</html>
